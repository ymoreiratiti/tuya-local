name: Air conditioner
products:
  - id: imk9jauie2cxv6ij
    manufacturer: Philco
    model: Eco Inverter
entities:
  - entity: climate
    translation_key: aircon_extra
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: hvac_mode_switch
            conditions:
              - dps_val: cold
                value: cool
              - dps_val: hot
                value: heat
              - dps_val: wet
                value: dry
              - dps_val: wind
                value: fan_only
              - dps_val: auto
                value: heat_cool
      - id: 2
        name: temperature
        type: integer
        unit: C
        range:
          min: 160
          max: 300
        mapping:
          - scale: 10
            step: 10
      - id: 3
        name: current_temperature
        type: integer
      - id: 4
        name: hvac_mode_switch
        type: string
        hidden: true
      - id: 5
        name: fan_mode
        type: string
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: mute
            value: quiet
          - dps_val: low
            value: low
          - dps_val: mid
            value: medium
          - dps_val: mid_high
            value: medhigh
          - dps_val: high
            value: high
          - dps_val: strong
            value: strong
      - id: 113
        name: swing_mode
        type: string
        mapping:
          - dps_val: "0"
            value: "off"
          - dps_val: "1"
            value: "on"
  - entity: switch
    translation_key: sleep
    dps:
      - id: 105
        name: switch
        type: string
        mapping:
          - dps_val: "off"
            value: false
          - dps_val: normal
            value: true
  - entity: light
    translation_key: display
    category: config
    dps:
      - id: 123
        name: switch
        type: string
        mapping:
          - dps_val: "0010"
            value: false
          - dps_val: "0018"
            value: true
